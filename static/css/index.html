<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Index Page</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-image: url('./static/image/space.jpg');
            background-size: cover;
            background-position: center;
        }
        form {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.8); /* 하얀색 배경에 약간의 투명도 */
            padding: 20px;
            border-radius: 10px; /* 테두리 둥글게 */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* 살짝 그림자 */
        }
        h1 {
            font-size: 24px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 300px;
            height: 30px;
            font-size: 16px;
            padding: 5px;
        }
        button {
            margin-top: 15px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <form action="/" method="POST">
        <h1>Youtube 동영상 비속어 필터링</h1>
        <input type="text" name="video_link" placeholder="Enter video link here"><br><br>
        <label for="mode">Select Mode:</label>
        <input type="radio" id="normal" name="mode" value="normal" checked>
        <label for="normal">Normal</label>
        <input type="radio" id="live" name="mode" value="live">
        <label for="live">Live</label><br><br>
        <button type="submit">Streaming</button>
    </form>
</body>
</html>
