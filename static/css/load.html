<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Load Page</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
            background-image: url('./static/image/space.jpg');
            background-size: cover;
            background-position: center;
        }
        .center {
            text-align: center;
            background-color: rgba(255, 255, 255, 0.8); /* 하얀색 배경에 투명도 */
            padding: 20px;
            border-radius: 10px; /* 둥근 테두리 */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* 그림자 */
        }
        #countdown {
            font-size: 2em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="center">
        <p>Loading...</p>
        <p id="countdown">10</p>
    </div>

    <script>
        let timeLeft = 10;
        const countdownElement = document.getElementById('countdown');

        function updateCountdown() {
            if (timeLeft > 0) {
                timeLeft--;
                countdownElement.textContent = timeLeft;
            } else {
                window.location.href = "/video";
            }
        }

        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
