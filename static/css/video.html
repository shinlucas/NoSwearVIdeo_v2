<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Video Page</title>
    <style>
        body {
            background-image: url('./static/image/space.jpg');
            background-size: cover;
            background-position: center;
        }
        video {
            width: 80%; /* 가로 크기를 50%로 설정 */
            height: 80%; /* 세로 크기를 50%로 설정 */
            display: block;
            margin: 0 auto; /* 가운데 정렬 */
            border: 10px solid;
            border-image: linear-gradient(45deg, #ff7e5f, #feb47b, #86e3ce, #d4a5a5) 1; /* 그라데이션 테두리 */
            border-radius: 15px; /* 테두리 둥글게 */
            padding: 5px; /* 테두리와 비디오 사이 여백 */
        }
    </style>
</head>
<body>
    <video id="mainVideo" autoplay>
        <source id="videoSource" src="/static/output/final_video_0.mp4" type="video/mp4">
    </video>
    <script>
        const video = document.getElementById('mainVideo');
        let videoIndex = 0;
        video.onended = function() {
            videoIndex++;
            const nextVideoSrc = `/static/output/final_video_${videoIndex}.mp4`; // .ts를 .mp4로 변경
            fetch(nextVideoSrc)
                .then(response => {
                    if (response.ok) {
                        document.getElementById('videoSource').src = nextVideoSrc;
                        video.load();
                        video.play();
                    } else {
                        // Handle the end of the video list if necessary
                        console.log("No more videos to play.");
                    }
                });
        };
    </script>
</body>
</html>
